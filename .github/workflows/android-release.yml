# Builds a signed APK on every push to main and publishes it as a GitHub
# Release. On the phone, Obtainium watches the releases and installs
# updates. See docs/UPDATES.md.
name: Android release

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 0.<run>; build number is offset so it is always above local builds.
      VERSION_NAME: 0.${{ github.run_number }}.0
      BUILD_NUMBER: ${{ github.run_number }}00
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See docs/UPDATES.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore size: $(wc -c < android/app/release.jks) bytes"
          if ! out=$(keytool -list -v -keystore android/app/release.jks \
                -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            echo "::error::Signing key check failed: $(echo "$out" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          fp=$(echo "$out" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          echo "::notice::Signing key OK, SHA-256 $fp"

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release \
              --target-platform android-arm64 \
              --build-name "$VERSION_NAME" \
              --build-number "$BUILD_NUMBER" 2>&1 | tee build.log; then
            msg=$(grep -A8 -E 'What went wrong|Error:' build.log | tr '\n' ' ' | cut -c1-1500)
            echo "::error::Build failed: $msg"
            exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/lock-in-$VERSION_NAME.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Lock-in ${{ env.VERSION_NAME }}
          body: |
            Automatic build from ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
